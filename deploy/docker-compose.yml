services:
  nginx:
    build:
      context: ../nginx
      args:
        NGINX_SITE: prod
    volumes:
      - ../nginx/html/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/ssl/cert:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      # server:
      #   condition: service_started
      agent:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "3000"
    env_file:
      - ../.env.prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - /var/log/private-chef:/app/logs:rw
    networks:
      - private_chef_network

  agent:
    build:
      # context 仅为 agent 目录；proto 通过 BuildKit 附加上下文供 Dockerfile 内 gen_proto.sh
      context: ../../private_chef_agent
      dockerfile: Dockerfile
      additional_contexts:
        server_proto: ../proto
    env_file:
      # 生产环境请在服务器上提供该文件（不要提交）
      - ../../private_chef_agent/.env.prod
    expose:
      - "8001"
    ports:
      - "8001:8001"
    volumes:
      - private_chef_agent_db_prod:/app/db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # # PostgreSQL 17（与常见本机开发版本一致）；宿主机端口 5433 避免与本机 5432 冲突
  # postgres:
  #   image: pgvector/pgvector:pg17
  #   ports:
  #     - "5433:5432"
  #   environment:
  #     POSTGRES_USER: "${DATABASE_USER:-postgres}"
  #     POSTGRES_PASSWORD: "${DATABASE_PASSWORD}"
  #     POSTGRES_DB: "${DATABASE_NAME}"
  #   volumes:
  #     - private_chef_postgres_prod:/var/lib/postgresql/data
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" || exit 1',
  #       ]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 30
  #     start_period: 20s

  redis:
    image: redis:7.0-alpine
    ports:
      - "6381:6379"
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - private_chef_redis_prod:/data

volumes:
  private_chef_postgres_prod:
  private_chef_redis_prod:
  private_chef_agent_db_prod:

# 网络配置
networks:
  private_chef_network:
    name: private_chef_network
    external: true
