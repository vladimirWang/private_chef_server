services:
  nginx:
    build:
      context: ../nginx
      args:
        NGINX_SITE: prod
    volumes:
      - ../nginx/html/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/ssl/cert:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      # server:
      #   condition: service_started
      agent:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "3000"
    env_file:
      - ../.env.prod
    # postgres 在 ../docker_infrastracture 独立 compose 中，跨项目无法用 depends_on；
    # 启动顺序由 start.sh 等待 shared-postgres 健康后再 up。
    depends_on:
      redis:
        condition: service_started
    volumes:
      - /var/log/private-chef:/app/logs:rw
    networks:
      - private_chef_network

  agent:
    build:
      # context 仅为 agent 目录；proto 通过 BuildKit 附加上下文供 Dockerfile 内 gen_proto.sh
      context: ../../private_chef_agent
      dockerfile: Dockerfile
      additional_contexts:
        server_proto: ../proto
    env_file:
      # 生产环境请在服务器上提供该文件（不要提交）
      - ../../private_chef_agent/.env.prod
    expose:
      - "8001"
    ports:
      - "8001:8001"
    volumes:
      - private_chef_agent_db_prod:/app/db
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=2).read()",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks:
      - private_chef_network

  # PostgreSQL 由 docker_infrastracture 提供（shared-postgres，网络 private_chef_network）。
  # 容器内连接主机名 postgres（服务名）或 shared-postgres（容器名），端口 5432。

  redis:
    image: redis:7.0-alpine
    ports:
      - "6381:6379"
    command:
      ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - private_chef_redis_prod:/data

volumes:
  private_chef_redis_prod:
  private_chef_agent_db_prod:

# 网络配置
networks:
  private_chef_network:
    name: private_chef_network
    external: true
