# 与 docker-compose.yml 并行运行：须配合 start-test.sh 的 -p private-chef-test
# 宿主机端口与生产错开：HTTP 8080、HTTPS 8443、PostgreSQL 5434、Redis 6380
# --env-file ../.env.test：与 .env.prod 同字段，供 postgres 与变量替换

services:
  nginx:
    build:
      context: ../nginx
      args:
        NGINX_SITE: test
    volumes:
      - ../nginx/html/dist:/usr/share/nginx/html:ro
      - ../nginx/ssl:/etc/ssl/cert:ro
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - server

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    expose:
      - "3000"
